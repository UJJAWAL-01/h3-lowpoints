[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h3-lowpoints"
version = "0.0.1"
description = "Find closed depressions in elevation models and map them on H3 cells at any resolution"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["h3", "dem", "lidar", "depressions", "hydrology", "gis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "rasterio>=1.3",
    "affine>=2.4",        # the @ operator on transforms
    "pyproj",
    "h3>=4",
    "numba",
]

[project.optional-dependencies]
sources = ["geopandas", "pyogrio", "shapely"]   # reading drain and building files
viz = ["pydeck"]
dev = ["pytest", "ruff", "shapely"]

[project.scripts]
h3lowpoints = "h3lowpoints.cli:main"

[project.urls]
Homepage = "https://github.com/ujjawal-01/h3-lowpoints"

[tool.hatch.build.targets.wheel]
packages = ["src/h3lowpoints"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (run with H3LP_NETWORK=1)"]
# Tests use coarse grids on purpose; the ones that check this warning use pytest.warns.
filterwarnings = [
    "ignore:The DEM cell size:UserWarning",
    # our own code must never rely on deprecated behaviour of the libraries it uses
    "error::DeprecationWarning:h3lowpoints.*",
    "error::PendingDeprecationWarning:h3lowpoints.*",
    "error::FutureWarning:h3lowpoints.*",
]
