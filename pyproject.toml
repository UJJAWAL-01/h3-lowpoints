[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h3-lowpoints"
version = "0.1.0"
description = "Find closed depressions in elevation models and map them on H3 cells at any resolution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ujjawal Patel" }]
maintainers = [{ name = "Ujjawal Patel" }]
keywords = ["h3", "dem", "lidar", "depressions", "hydrology", "gis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "rasterio>=1.3",
    "affine>=2.4",        # the @ operator on transforms
    "pyproj",
    "h3>=4",
    "numba",
]

[project.optional-dependencies]
sources = ["geopandas", "pyogrio", "shapely"]   # reading drain and building files
viz = ["pydeck"]
parquet = ["pyarrow>=14"]                       # writing and reading .parquet results
dev = ["pytest", "ruff", "shapely", "pyarrow>=14"]

[project.scripts]
h3lowpoints = "h3lowpoints.cli:main"

[project.urls]
Homepage = "https://github.com/UJJAWAL-01/h3-lowpoints"
Documentation = "https://ujjawal-01.github.io/h3-lowpoints/"
Changelog = "https://github.com/UJJAWAL-01/h3-lowpoints/blob/main/CHANGELOG.md"
Issues = "https://github.com/UJJAWAL-01/h3-lowpoints/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/h3lowpoints"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (run with H3LP_NETWORK=1)"]
# Tests use coarse grids on purpose; the ones that check this warning use pytest.warns.
filterwarnings = [
    "ignore:The DEM cell size:UserWarning",
    # our own code must never rely on deprecated behaviour of the libraries it uses
    "error::DeprecationWarning:h3lowpoints.*",
    "error::PendingDeprecationWarning:h3lowpoints.*",
    "error::FutureWarning:h3lowpoints.*",
]
